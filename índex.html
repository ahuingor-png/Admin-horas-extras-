.wrap{max-width:760px;margin:0 auto;padding:0 14px}
header{background:#4a3fe0;color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 0 0}
header .r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:12px}
header h1{margin:0;font-size:19px;letter-spacing:-.01em}header small{opacity:.8;font-size:12px}
header .out{background:rgba(255,255,255,.18);color:#fff;border-radius:10px;padding:8px 14px;font-weight:700;font-size:13px}
.tabs{display:flex;gap:4px}.tabs button{flex:1;background:none;color:#fff;opacity:.7;font-weight:700;padding:12px 4px;border-bottom:3px solid transparent}
.tabs button.on{opacity:1;border-color:#fff}.tabs b{background:#f59e0b;color:#17203a;border-radius:99px;padding:1px 7px;font-size:11px;margin-left:5px}
main{padding-top:14px}
.card{background:var(--sf);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px rgba(40,50,110,.08)}
.in{width:100%;height:48px;border:1px solid var(--ln);background:var(--sf3);border-radius:13px;padding:0 13px;font-size:16px;outline:none;margin-bottom:12px}
.in:focus{border-color:var(--ac)}
.btn{background:var(--ac);color:#fff;border-radius:13px;height:48px;padding:0 18px;font-weight:800;width:100%}
.sm{height:38px;width:auto;padding:0 13px;font-size:13px;border-radius:10px;background:var(--sf3);color:var(--tx);font-weight:700}
.sm.p{background:var(--ac);color:#fff}.sm.d{background:var(--dgs);color:var(--dg)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.mu{color:var(--mu);font-size:13px}.k{font-family:ui-monospace,Menlo,monospace;font-weight:800;letter-spacing:.15em;background:var(--sf3);border-radius:8px;padding:3px 9px}
.act{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.err{background:var(--dgs);color:var(--dg);border-radius:12px;padding:11px 13px;font-size:13px;font-weight:600;margin-bottom:12px;display:none}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.g div{background:var(--sf3);border-radius:12px;padding:10px}
.g small{display:block;color:var(--mu);font-size:11px;font-weight:700;text-transform:uppercase}.g b{font-size:17px}
.pill{border-radius:99px;padding:3px 10px;font-size:12px;font-weight:800}.pe{background:var(--ams);color:var(--am)}.pn{background:var(--grs);color:var(--gr)}
.rec{border-top:1px solid var(--ln);padding:10px 0}.hid{display:none!important}
.dim{opacity:.55}

#splash{position:fixed;inset:0;z-index:100;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:28px calc(28px + env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) calc(28px + env(safe-area-inset-left));text-align:center;transition:opacity .5s,visibility .5s}
#splash.out{opacity:0;visibility:hidden}
#splash img{width:min(60vw,240px);height:auto;border-radius:28px;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both,float 2.4s ease-in-out .7s infinite}
#splash .ph{max-width:340px;font-size:17px;line-height:1.5;font-weight:700;color:#17307a;opacity:0;animation:fade .9s .5s forwards}
#splash .pb{width:min(70vw,260px);height:8px;background:#e3e7f3;border-radius:99px;overflow:hidden}
#splash .pb i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#2563eb,#38bdf8);transition:width .2s linear}
#splash small{font-weight:800;color:#68708c;font-size:13px;margin-top:-10px}
@keyframes pop{from{transform:scale(.5);opacity:0}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes fade{to{opacity:1}}
@media(prefers-reduced-motion:reduce){#splash img{animation:none}}
</style></head><body>
<div id="splash" role="status" aria-label="Cargando">
  <img id="logo" alt="Admin Horas Extras">
  <div class="ph">“Detrás de cada correo hay alguien esperando tu respuesta. Tu trabajo importa más de lo que crees. ¡A darle con todo hoy!” 💪📧</div>
  <div class="pb"><i id="spb"></i></div><small id="spp">0%</small>
</div>
<section id="login" class="wrap" style="max-width:420px;padding-top:calc(40px + env(safe-area-inset-top,0px))">
  <h1 style="margin:0 0 4px">Panel de administración</h1><p class="mu" style="margin:0 0 18px">Control de Horas Extras · acceso solo para el administrador</p>
  <div class="card"><div class="err" id="lerr"></div>
    <form id="lf"><input class="in" id="le" type="email" autocomplete="username" placeholder="Correo del administrador" required>
    <input class="in" id="lp" type="password" autocomplete="current-password" placeholder="Contraseña" required>
    <button class="btn" id="lb">Entrar</button></form></div>
</section>
<div id="app" class="hid">
  <header><div class="wrap"><div class="r"><div><h1>Panel de administración</h1><small id="who"></small></div><button class="out" id="out">Salir</button></div>
    <div class="tabs"><button data-t="u" class="on">Usuarios</button><button data-t="s">Solicitudes <b id="pend" class="hid">0</b></button></div></div></header>
  <main class="wrap">
    <div class="err" id="aerr"></div>
    <div id="nb" class="hid" style="background:var(--ams);color:var(--am);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px"><span id="nbt"></span><button class="sm p" id="nbv">Ver</button></div>
    <section id="vu"><input class="in" id="q" type="search" placeholder="Buscar usuario por nombre…"><div id="ul"></div></section>
    <section id="vs" class="hid"><div id="sl"></div></section>
    <section id="vd" class="hid"></section>
  </main>
</div>
